<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tutoring Groups Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a viewer shell (screen list left, frame right) around faithful light-theme frames of the Early Intervention Platform. */
:root {
  --bg: #e9edf1; --fg: #142131; --muted: #5c6b7c; --panel: #ffffff; --line: #cfd7df; --accent: #234b6b; --accent-soft: #e3e9ee;
  --new: #b7791f; --new-bg: #fff6e0;
  /* App frame tokens: the live app is light-only; these stay fixed in both themes on purpose. */
  --ku-blue: #234b6b; --ku-navy: #0b1e2f; --surface: #edf1f4; --card: #ffffff; --border: #cfd7df; --text: #142131; --text-2: #3f5061; --text-3: #667687;
  --tutor-green: #2f9e44; --tutor-green-bg: #e7f4ea; --tutor-green-fg: #1f6f43; --student-green: #12a37d; --student-bg: #e4f4ed; --booking-purple: #5140eb; --booking-bg: #eff0fb;
  --ok: #356b53; --ok-bg: #e4f1ea; --warn: #85651d; --warn-bg: #fbf1d9; --bad: #963a47; --bad-bg: #f7e3e6; --info: #234b6b; --info-bg: #e3e9ee;
  --font: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141a21; --fg: #e6ecf2; --muted: #9db0c3; --panel: #1c242d; --line: #33414f; --accent: #8db4d6; --accent-soft: #233241; --new: #e0b45b; --new-bg: #3a2f14; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141a21; --fg: #e6ecf2; --muted: #9db0c3; --panel: #1c242d; --line: #33414f; --accent: #8db4d6; --accent-soft: #233241; --new: #e0b45b; --new-bg: #3a2f14; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button { font-family: inherit; }
.wrap { padding-block: 12px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
header.top > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
header.top h1 { font-size: 19px; margin: 0; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--new); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
nav.screens { position: sticky; top: 12px; display: grid; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
@media (max-width: 900px) { nav.screens { position: static; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
nav.screens button { display: grid; gap: 1px; text-align: left; border: 0; background: none; border-radius: 7px; padding: 6px 10px; font-size: 13px; line-height: 1.3; cursor: pointer; color: var(--fg); }
nav.screens button:hover { background: var(--accent-soft); }
nav.screens button[aria-current="true"] { background: var(--accent); color: #fff; }
nav.screens button small { font-size: 11px; opacity: .75; letter-spacing: .03em; text-transform: uppercase; }
nav.screens .group-label { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 0; }
.stage { min-width: 0; }
.stage-note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.stage-note strong { color: var(--fg); }
/* The app frame is drawn at desktop width and scaled down to fit the window, so nothing scrolls sideways. */
.frame-scroll { position: relative; overflow: hidden; border-radius: 12px; }
.frame { position: absolute; top: 0; left: 0; transform-origin: top left; width: 1180px; min-height: 560px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: 56px 1fr; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 18px; }
.brand { width: 34px; height: 34px; border-radius: 8px; background: var(--ku-navy); color: #fff; font-weight: 800; font-size: 12px; display: grid; place-items: center; letter-spacing: .04em; }
.topbar .title { font-weight: 700; font-size: 15px; }
.topbar .sub { color: var(--text-3); font-size: 12px; }
.topbar .spacer { flex: 1; }
.bell { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: 13px; }
.bell::after { content: attr(data-count); position: absolute; top: -6px; right: -6px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 0 5px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--ku-blue); color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.body { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.body.no-side { grid-template-columns: 1fr; }
.side { background: var(--card); border-right: 1px solid var(--border); padding: 12px 10px; display: grid; gap: 4px; align-content: start; }
.side a { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 7px; color: var(--text-2); font-weight: 600; font-size: 13px; text-decoration: none; }
.side a .ic { width: 16px; text-align: center; color: var(--text-3); }
.side a span { flex: 1; }
.side a .badge, .side a .ic { flex: none; }
.side a .badge { font-size: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; color: var(--text-2); }
.side a.active { background: var(--tutor-green-bg); color: var(--tutor-green-fg); }
.side a.active .ic { color: var(--tutor-green-fg); }
.side a.ctl.active { background: var(--accent-soft); color: var(--ku-blue); }
.page { padding: 16px 22px 18px; min-width: 0; }
.page h2 { margin: 0 0 4px; font-size: 20px; }
.page .lead { margin: 0 0 12px; color: var(--text-2); }
.hero { border-radius: 14px; padding: 14px 20px; background: linear-gradient(120deg, #111a38, #203673); color: #fff; margin-bottom: 16px; }
.hero small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; opacity: .8; }
.hero h2 { color: #fff; margin: 2px 0 4px; }
.hero p { margin: 0; opacity: .9; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1px solid var(--border); background: var(--card); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--ku-blue); border-color: var(--ku-blue); color: #fff; }
.tabs { display: inline-flex; gap: 6px; padding: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; border-radius: 10px; padding: 7px 16px; font-weight: 700; color: var(--text-2); cursor: pointer; }
.tabs button.on { background: var(--ku-blue); color: #fff; }
.btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--ku-blue); border-color: var(--ku-blue); color: #fff; }
.btn.green { background: var(--tutor-green); border-color: var(--tutor-green); color: #fff; }
.btn.danger { color: var(--bad); border-color: #e3b9bf; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.student { background: var(--student-green); border-color: var(--student-green); color: #fff; border-radius: 22px; padding: 10px 18px; font-size: 14px; font-weight: 800; }
.btn.student.ghost { background: #fff; color: var(--text); border-color: #cfe5db; }
.btn.purple { background: var(--booking-purple); border-color: var(--booking-purple); color: #fff; border-radius: 10px; }
.btn.purple.ghost { background: #fff; color: var(--text); border-color: #dfe1f1; }
.teams { display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; padding: 5px 10px; background: #5059c9; color: #fff; font-weight: 700; font-size: 12px; text-decoration: none; }
.teams::before { content: "T"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: #fff; color: #5059c9; font-size: 10px; font-weight: 900; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 3px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.synced { background: var(--ok-bg); color: var(--ok); }
.pill.pending { background: var(--info-bg); color: var(--info); }
.pill.failed { background: var(--warn-bg); color: var(--warn); }
.pill.none { background: var(--surface); color: var(--text-3); }
.pill.plain::before { display: none; }
.pill.group { background: #ebe6f6; color: #5b3fa8; }
.pill.peer { background: #e0f2f0; color: #11695f; }
.pill.faculty { background: #ebe6f6; color: #5b3fa8; }
.pill.attended { background: var(--ok-bg); color: var(--ok); }
.pill.missed { background: var(--bad-bg); color: var(--bad); }
.pill.awaiting { background: var(--warn-bg); color: var(--warn); }
.pill.tentative { background: var(--warn-bg); color: var(--warn); border: 1px dashed #d1b46a; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border: 1px solid #ecd9a3; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.banner strong { color: #5f4612; }
.avail { border-left: 4px solid var(--warn); background: var(--warn-bg); color: #5f4612; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.avail.ok { border-left-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.avail strong { display: block; margin-bottom: 2px; }
.avail .sugg { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.avail .sugg button { border: 1px solid #d1b46a; background: #fff; color: #5f4612; border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.modal.wide { width: 640px; max-height: 92%; overflow: auto; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text-2); }
.seat i { display: inline-flex; gap: 2px; }
.seat i b { width: 8px; height: 12px; border-radius: 2px; background: var(--tutor-green); display: inline-block; }
.seat i b.e { background: var(--border); }
.seat.full i b { background: var(--warn); }
.new { outline: 2px dashed transparent; outline-offset: 3px; border-radius: 6px; transition: outline-color .2s; }
.show-new .new { outline-color: var(--new); }
.show-new .new::before { content: "new"; position: absolute; transform: translate(-2px, -18px); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; background: var(--new); color: #fff; padding: 1px 5px; border-radius: 4px; }
.new { position: relative; }

/* Tutor cards */
.tlist { display: grid; gap: 10px; }
.tcard { background: var(--card); border: 1px solid #e1e6ec; border-left: 4px solid var(--tutor-green); border-radius: 10px; }
.tcard.grp { border-left-color: #5b3fa8; }
.tcard .head { display: flex; justify-content: space-between; gap: 16px; padding: 11px 18px 6px; }
.tcard .name { font-size: 15px; font-weight: 700; color: #1a3b63; }
.tcard .id { border: 1px solid #d7dee6; border-radius: 6px; padding: 1px 7px; font-size: 11px; margin-left: 6px; color: var(--text-2); }
.tcard .meta { font-size: 11px; color: #8a97a8; margin-top: 3px; }
.tcard .when { text-align: right; display: grid; gap: 2px; justify-items: end; }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: #8a97a8; font-weight: 700; }
.tcard .bodyx { padding: 0 18px 10px; display: grid; gap: 8px; }
.tcard .field { font-size: 13px; color: var(--text-2); }
.tcard .alert { background: #fff6e0; border: 1px solid #f1d9a0; border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tcard .alert strong { color: #7a4e00; }
.tcard .actions { padding: 8px 18px; border-top: 1px solid #eef1f5; background: #fbfcfe; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-radius: 0 0 10px 10px; }
.tcard .actions .right { margin-left: auto; display: flex; gap: 8px; }
.inv { display: flex; align-items: center; gap: 8px; }

/* Tables */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: 9px 12px; border-bottom: 1px solid var(--border); }
table.t td { padding: 8px 12px; border-bottom: 1px solid #e8edf1; vertical-align: top; }
table.t td small { display: block; color: var(--text-3); margin-top: 2px; }
table.t tr.failed-row td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ctl-table .row-actions { flex-wrap: nowrap; gap: 4px; }
.ctl-table .icon-btn { width: 28px; height: 28px; }
.ctl-table td:nth-child(2) { white-space: nowrap; }
.icon-btn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: #fff; display: inline-grid; place-items: center; font-size: 13px; cursor: pointer; color: var(--text-2); }
.icon-btn:hover { border-color: var(--ku-blue); color: var(--ku-blue); }

/* Forms */
.form { display: grid; gap: 14px; max-width: 760px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.form label { display: grid; gap: 5px; font-size: 12px; font-weight: 700; color: var(--text-2); }
.form input, .form select, .form textarea { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: #fff; color: var(--text); }
.form .preview { background: var(--tutor-green-bg); color: var(--tutor-green-fg); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.form .foot { display: flex; gap: 10px; justify-content: flex-end; }
.hint { font-size: 12px; color: var(--text-3); font-weight: 400; }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 600; font-size: 13px; }
.radio-row label { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.switch input { width: 38px; height: 22px; appearance: none; background: var(--border); border-radius: 20px; position: relative; cursor: pointer; outline: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch input:checked { background: var(--tutor-green); }
.switch input:checked::after { left: 19px; }

/* Group detail */
.two { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.roster li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eef1f5; font-size: 13px; }
.roster li span { flex: 1; }
.roster li .via { font-size: 11px; color: var(--text-3); }
.roster { list-style: none; margin: 0; padding: 0; }
.occ { list-style: none; margin: 0; padding: 0; }
.occ li { border-bottom: 1px solid #eef1f5; }
.occ .line { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: center; padding: 6px 14px; min-height: 40px; font-size: 13px; cursor: pointer; }
.occ .line .n { font-size: 11px; color: var(--text-3); font-weight: 700; }
.occ .line.past { color: var(--text-3); }
.att { padding: 4px 14px 14px 60px; display: grid; gap: 8px; }
.att .arow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.att select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
.drawer { background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.drawer label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; }

/* Student */
.student .welcome { background: var(--student-bg); color: #073945; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; }
.student .welcome h2 { color: #073945; }
.sref { background: #fff; border-radius: 16px; padding: 18px 22px; display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; border: 1px solid #d6ebe2; }
.sref + .sref { margin-top: 12px; }
.ring { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--student-green) 0 62%, #d7eee6 62% 100%); }
.ring b { width: 74px; height: 74px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.2; color: #073945; }
.ring b strong { font-size: 18px; display: block; }
.sref h3 { margin: 0 0 4px; font-size: 16px; }
.sref p { margin: 2px 0; color: var(--text-2); font-size: 13px; }
.sref .status { display: inline-block; padding: 3px 11px; border-radius: 30px; background: #e2f4ec; color: #08785b; font-weight: 700; font-size: 12px; }
.sref .col { display: grid; gap: 8px; justify-items: end; }
.dialog { background: #fff; border-radius: 16px; padding: 24px 28px; color: #191b30; max-width: 900px; box-shadow: 0 20px 50px rgba(11,30,47,.18); margin: 0 auto; }
.dialog .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--booking-purple); font-weight: 800; margin: 0 0 4px; }
.dialog h2 { margin: 0 0 14px; }
.tutor-opt { border: 1px solid #e3e5f2; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.tutor-opt h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.tutor-opt .hours { font-size: 13px; color: var(--text-2); margin: 4px 0 10px; }
.grow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #f5f3ff; border: 1px solid #ddd6f3; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.grow .txt { flex: 1; min-width: 200px; font-size: 13px; }
.grow .txt strong { display: block; color: #3d2c7a; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slots button { background: #fff; border: 1px solid #dfe1f1; border-radius: 30px; padding: 8px 13px; font-size: 14px; cursor: pointer; }
.slots button.on { background: var(--booking-purple); color: #fff; border-color: var(--booking-purple); }
.dialog .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.dialog .tz { font-size: 12px; color: var(--text-3); margin-top: 10px; }
.summary { background: var(--booking-bg); border-radius: 14px; padding: 18px 20px; }
.summary p { margin: 4px 0; }

/* CTL */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.tile.warn .v { color: var(--warn); }
.tile.bad .v { color: var(--bad); }
.tile.ok .v { color: var(--ok); }
.health { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.settings { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.result { border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
.result.ok { background: var(--ok-bg); color: var(--ok); }

/* Modal (in frame) */
.modal-bg { position: absolute; inset: 0; background: rgba(11,30,47,.45); display: grid; place-items: center; z-index: 5; }
.modal { background: #fff; border-radius: 12px; width: 480px; max-width: 92%; padding: 20px 22px; box-shadow: 0 20px 50px rgba(11,30,47,.3); color: var(--text); }
.modal h3 { margin: 0 0 6px; font-size: 17px; }
.modal p.sub { margin: 0 0 14px; color: var(--text-2); font-size: 13px; }
.modal .note { background: var(--info-bg); color: var(--info); border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    var isCancel = m.kind === 'cancel';
    if (m.kind === 'resched') {
      return '<div class="modal-bg" data-act="closebg"><div class="modal" role="dialog" aria-modal="true"><h3>Reschedule series</h3><p class="sub">Move the remaining weekly sessions of ' + h(m.who) + '. Past sessions stay where they were.</p>' +
        '<form class="form" style="gap:10px"><div class="row"><label>Weekday<select><option>Monday</option><option selected>Tuesday</option><option>Wednesday</option><option>Thursday</option></select></label><label>Start time<select><option>4:00 PM</option><option>4:30 PM</option><option selected>5:30 PM</option></select></label></div>' +
        '<label>Reason <span class="hint">shown to attendees</span><input id="mReason" placeholder="e.g. Room change"></label>' +
        '<div class="avail ok">Free on all 11 remaining dates, inside the tutor\'s hours.</div>' +
        '<div class="note">11 remaining sessions move. Students, CTL and the counselor get the updated invite.</div>' +
        '<div class="foot"><button type="button" class="btn" data-act="close">Back</button><button type="button" class="btn primary" data-act="confirm">Move series</button></div></form></div></div>';
    }
    if (m.kind === 'chtutor') {
      return '<div class="modal-bg" data-act="closebg"><div class="modal" role="dialog" aria-modal="true"><h3>Change tutor</h3><p class="sub">Move the remaining weeks of ' + h(m.who) + ' to another tutor. Past sessions stay with Amal Hassan.</p>' +
        '<form class="form" style="gap:10px"><label>New tutor<select><option>Hamad Juma · Peer tutor · Mon–Wed 1–3 PM</option><option>Dana Haddad · Faculty tutor · Wed 9–11 AM</option></select></label>' +
        '<label>Reason <span class="hint">shown to both tutors and CTL</span><input id="mReason" placeholder="e.g. Tutor on leave from December"></label>' +
        '<div class="avail ok">Hamad Juma is free on all 9 remaining dates.</div>' +
        '<div class="note">9 remaining sessions move to the new tutor, who is asked to confirm. Members\' referrals move with the group. Students get a new invite.</div>' +
        '<div class="foot"><button type="button" class="btn" data-act="close">Back</button><button type="button" class="btn primary" data-act="confirm">Change tutor</button></div></form></div></div>';
    }
    return '<div class="modal-bg" data-act="closebg"><div class="modal" role="dialog" aria-modal="true"><h3>' + (isCancel ? 'Cancel session' : 'Move session') + '</h3><p class="sub">' + (isCancel ? 'Cancel ' : 'Move ') + h(m.who) + '. ' + (isCancel ? 'The referral goes back to "awaiting booking" if its deadline has not passed.' : 'The same Outlook invite is updated.') + '</p>' +
      '<form class="form" style="gap:10px">' + (isCancel ? '' : '<label>New time (UAE)<input type="datetime-local" value="2026-11-06T16:00"></label>') +
      '<label>Reason <span class="hint">shown to attendees</span><input id="mReason" placeholder="' + (isCancel ? 'e.g. Tutor unwell' : 'e.g. Room unavailable') + '"></label>' +
      '<div class="note">Attendees get an updated invite' + (isCancel ? ' and a cancellation' : '') + '. CTL is kept informed.</div>' +
      '<div class="foot"><button type="button" class="btn" data-act="close">Back</button><button type="button" class="btn ' + (isCancel ? 'danger' : 'primary') + '" data-act="confirm">' + (isCancel ? 'Cancel session' : 'Move session') + '</button></div></form></div></div>';
  }

  function render() {
    var frame = $('#frame');
    frame.innerHTML = RENDER[state.screen]() + modalHtml() + (state.toast ? '<div class="toast" role="status">' + h(state.toast) + '</div>' : '');
    $('#note').innerHTML = NOTES[state.screen];
    var nav = $('#nav'), html = '', lastG = '';
    SCREENS.forEach(function (s, i) {
      if (s.g !== lastG) { html += '<div class="group-label">' + s.g + '</div>'; lastG = s.g; }
      html += '<button data-act="go" data-to="' + s.id + '" aria-current="' + (s.id === state.screen) + '"><small>' + (i + 1) + ' · ' + h(s.t) + '</small><span>' + h(s.s) + '</span></button>';
    });
    nav.innerHTML = html;
    if (state.screen === 's3') { var p = $('#cgPrev'); if (p) p.textContent = previewText(); }
    document.body.classList.toggle('show-new', $('#newToggle').checked);
    try { localStorage.setItem('tgm-screen', state.screen); } catch (e) {}
    fit();
  }
  /* Scale the frame to the stage width, and to the window height on desktop, so a whole screen shows without scrolling. */
  function fit() {
    var host = $('.frame-scroll'), frame = $('#frame');
    if (!host || !frame) return;
    frame.style.transform = 'none';
    var natW = frame.offsetWidth, natH = frame.offsetHeight, availW = host.clientWidth;
    var s = Math.min(1, availW / natW);
    if (window.innerWidth > 900) {
      var top = host.getBoundingClientRect().top + (window.scrollY || 0);
      var availH = window.innerHeight - top - 14;
      if (availH > 240) s = Math.min(s, Math.max(availH / natH, 0.62));
    }
    frame.style.transform = 'scale(' + s + ')';
    frame.style.left = Math.max(0, (availW - natW * s) / 2) + 'px';
    host.style.height = Math.ceil(natH * s) + 'px';
  }
  window.addEventListener('resize', fit);
  try { new ResizeObserver(fit).observe(document.querySelector('.stage')); } catch (e) {}
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  function toast(msg) {
    state.toast = msg; render();
    clearTimeout(toast.t); toast.t = setTimeout(function () { state.toast = null; render(); }, 2600);
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (el.tagName === 'A' || el.tagName === 'BUTTON' || act === 'closebg') ev.preventDefault();
    if (act === 'closebg' && ev.target !== el) return;
    switch (act) {
      case 'go': state.screen = el.getAttribute('data-to'); state.modal = null; render(); break;
      case 'move': case 'cancel': state.modal = { kind: act, who: el.getAttribute('data-who') }; render(); break;
      case 'close': case 'closebg': state.modal = null; render(); break;
      case 'confirm': {
        var m = state.modal; var reason = $('#mReason');
        if (reason && !reason.value.trim()) { reason.focus(); reason.style.borderColor = 'var(--bad)'; return; }
        state.modal = null;
        if (m.kind === 'resched') { state.tentative = false; toast('Series moved. 11 remaining sessions updated; the invite is no longer tentative.'); break; }
        if (m.kind === 'chtutor') { state.tentative = true; toast('Tutor changed. Remaining weeks go to the new tutor as tentative; both tutors, students and CTL are told.'); break; }
        if (m.kind === 'cancel' && m.who === 'Salem Al Marzooqi') state.cancelledSalem = true;
        if (m.kind === 'move' && m.who === 'Salem Al Marzooqi') state.invite.salem = 'pending';
        toast(m.kind === 'cancel' ? 'Session cancelled. Attendees get a cancellation.' : 'Session moved. Attendees get an updated invite.');
        if (m.kind === 'move' && m.who === 'Salem Al Marzooqi') setTimeout(function () { state.invite.salem = 'synced'; render(); }, 2000);
        break;
      }
      case 'cycle': { var k = el.getAttribute('data-key'); var order = ['pending', 'synced', 'failed']; state.invite[k] = order[(order.indexOf(state.invite[k]) + 1) % 3]; render(); break; }
      case 'accept': state.timeReq = false; toast('Session moved to Tue 10 Nov 5:00 PM. Invite updated.'); break;
      case 'decline': state.timeReq = false; toast('Request declined. The session stays on Tue 3 Nov.'); break;
      case 'teams': toast('Opens the Teams meeting in a new tab'); break;
      case 'join': state.joined = true; state.group.seats = Math.min(state.group.capacity, state.group.seats + 1); toast('You joined ' + state.group.name + '. Invite on its way.'); break;
      case 'drawer': state.drawer = !state.drawer; render(); break;
      case 'addmember': state.drawer = false; if (!state.joined) { state.joined = true; state.group.seats = Math.min(state.group.capacity, state.group.seats + 1); } toast('Hessa Al Nuaimi added. She gets the invite for every coming session.'); break;
      case 'occ': { var i = +el.getAttribute('data-i'); state.openOcc = state.openOcc === i ? -1 : i; render(); break; }
      case 'ctlv': state.ctlView = el.getAttribute('data-v'); render(); break;
      case 'ctlf': state.ctlFilter = el.getAttribute('data-f'); render(); break;
      case 'confirmg': state.tentative = false; toast('Group confirmed. Students and CTL are told; the invite is no longer tentative.'); break;
      case 'resched': case 'chtutor': state.modal = { kind: act, who: el.getAttribute('data-who') || 'MATH 112 Tuesday' }; render(); break;
      case 'cttime': state.ctlTime = el.getAttribute('data-v'); render(); break;
      case 'ctlcreatego': state.ctlCreated = true; state.ctlView = 'groups'; state.screen = 's7'; toast('Group created as tentative. Amal Hassan is invited and can confirm, edit or move it.'); break;
      case 'create': toast('Group created. 12 sessions are in your Outlook calendar.'); setTimeout(function () { state.screen = 's2'; render(); }, 1200); break;
      case 'reqtime': toast('Pick a new time; your tutor confirms it. The current time stands until then.'); break;
      case 'scancel': toast('Session cancelled. The slot is free again and you can book another.'); break;
      case 'igtest': state.integ.tested = true; render(); break;
      case 'toast': toast(el.getAttribute('data-msg')); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (el) {
      var act = el.getAttribute('data-act');
      if (act === 'ig') { state.integ[el.getAttribute('data-k')] = el.checked; render(); return; }
      if (act === 'igmode') { state.integ.mode = el.getAttribute('data-v'); render(); return; }
      if (act === 'cttime') { state.ctlTime = el.value; render(); return; }
    }
    if (ev.target.id === 'newToggle') { render(); return; }
    if (['cgStart', 'cgEnd', 'cgDay'].indexOf(ev.target.id) >= 0) { var p = $('#cgPrev'); if (p) p.textContent = previewText(); }
  });

  try { var saved = localStorage.getItem('tgm-screen'); if (saved && RENDER[saved]) state.screen = saved; } catch (e) {}
  render();
})();
</script>

</body></html>
